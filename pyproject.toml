[project]
name = "keshigomu"
version = "0.1.0"
description = "Remove Japanese subtitle SDH annotations and furigana with TypeSafe"
readme = "README.md"
authors = [
    { name = "Jack Kehler", email = "jtkehler@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pysubs2>=1.9.0",
    "typer>=0.27.2",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
keshigomu = "keshigomu.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
